<!doctype html><html lang=zh-CN><head><meta charset=UTF-8><title>时钟</title><style>body{font-family:system-ui;background:linear-gradient(135deg,#1e293b,#0f172a);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;margin:0}#t{font-size:64px;font-weight:300;letter-spacing:4px}#d{font-size:18px;color:#94a3b8;margin-top:12px}</style></head><body><div id=t>--:--:--</div><div id=d></div><script>function tick(){const n=new Date();document.getElementById(%27t%27).textContent=n.toLocaleTimeString(%27zh-CN%27,{hour12:false});document.getElementById(%27d%27).textContent=n.toLocaleDateString(%27zh-CN%27,{year:%27numeric%27,month:%27long%27,day:%27numeric%27,weekday:%27long%27});}tick();setInterval(tick,1000);</script></body></html>
