<!doctype html><html lang=zh-CN><head><meta charset=UTF-8><title>计算器</title><style>body{font-family:system-ui;background:#f5f6fa;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.c{background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:20px;width:280px}#d{width:100%;height:56px;border:none;background:#1f2937;color:#fff;font-size:24px;text-align:right;border-radius:10px;box-sizing:border-box;padding:0 12px;margin-bottom:12px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{height:48px;border:none;border-radius:10px;font-size:18px;cursor:pointer;background:#eef0f4}button.op{background:#4a8ff7;color:#fff}button.eq{background:#22c55e;color:#fff;grid-column:span 2}</style></head><body><div class=c><input id=d value=0 readonly><div class=g><button onclick="cl()">C</button><button onclick="bk()">←</button><button class=op onclick="ad(%27/%27)">÷</button><button class=op onclick="ad(%27*%27)">×</button><button onclick="ad(%277%27)">7</button><button onclick="ad(%278%27)">8</button><button onclick="ad(%279%27)">9</button><button class=op onclick="ad(%27-%27)">−</button><button onclick="ad(%274%27)">4</button><button onclick="ad(%275%27)">5</button><button onclick="ad(%276%27)">6</button><button class=op onclick="ad(%27+%27)">+</button><button onclick="ad(%271%27)">1</button><button onclick="ad(%272%27)">2</button><button onclick="ad(%273%27)">3</button><button class=op onclick="ad(%27.%27)">.</button><button class=eq onclick="eq()">=</button><button onclick="ad(%270%27)">0</button></div></div><script>let s=%27%27;const d=document.getElementById(%27d%27);function cl(){s=%27%27;d.value=%270%27}function bk(){s=s.slice(0,-1);d.value=s||%270%27}function ad(c){s+=c;d.value=s}function eq(){try{const r=Function(%27return(%27+s+%27)%27)();d.value=String(r);s=String(r)}catch(e){d.value=%27错误%27;}}</script></body></html>
