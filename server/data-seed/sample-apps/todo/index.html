<!doctype html><html lang=zh-CN><head><meta charset=UTF-8><title>待办清单</title><style>body{font-family:system-ui;background:#f0fdf4;display:flex;justify-content:center;padding-top:60px;margin:0}.c{background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.1);padding:24px;width:340px}h1{font-size:20px;margin:0 0 16px}form{display:flex;gap:8px}input{flex:1;height:38px;border:1px solid #d1d5db;border-radius:8px;padding:0 10px}button{height:38px;border:none;border-radius:8px;background:#22c55e;color:#fff;padding:0 14px;cursor:pointer}li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f3f4f6}li.done span{text-decoration:line-through;color:#9ca3af}li span{cursor:pointer}li em{color:#ef4444;cursor:pointer;font-style:normal}</style></head><body><div class=c><h1>待办清单</h1><form onsubmit=%27add();return false%27><input id=i placeholder=%27添加一条待办…%27><button>添加</button></form><ul id=l></ul></div><script>let items=JSON.parse(localStorage.getItem(%27knowly-todo%27)||%27[]%27);function save(){localStorage.setItem(%27knowly-todo%27,JSON.stringify(items));render()}function add(){const i=document.getElementById(%27i%27);if(!i.value.trim())return;items.push({t:i.value.trim(),d:false});i.value=%27%27;save()}function toggle(n){items[n].d=!items[n].d;save()}function del(n){items.splice(n,1);save()}function render(){document.getElementById(%27l%27).innerHTML=items.map((x,n)=>%27<li class=%27+(x.d?%27done%27:%27%27)+%27><span onclick=%27+JSON.stringify(%27toggle(%27+n+%27)%27)+%27>%27+x.t+%27</span><em onclick=%27+JSON.stringify(%27del(%27+n+%27)%27)+%27>删除</em></li>%27).join(%27%27)}render();</script></body></html>
